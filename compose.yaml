services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sgbc_django
      MYSQL_USER: sgbc
      MYSQL_PASSWORD: sgbc_dev_password
      MYSQL_ROOT_PASSWORD: sgbc_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_DATABASE: sgbc_django
      MYSQL_USER: sgbc
      MYSQL_PASSWORD: sgbc_dev_password
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: "3306"
    volumes:
      - ./datamodel_demo:/app
      - ./docs:/docs:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_DATABASE: sgbc_django
      MYSQL_USER: sgbc
      MYSQL_PASSWORD: sgbc_dev_password
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: "3306"
    volumes:
      - ./datamodel_demo:/app
    ports:
      - "8888:8888"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: